name: Build Release (APK & IPA)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Assemble APK
        run: flutter build apk --release

      - name: Collect artifacts
        id: apk
        run: |
          mkdir -p dist
          version=$(python3 -c "
          import re
          with open('pubspec.yaml') as f:
              m = re.search(r'^version:\s*([^\+\s]+)', f.read(), re.M)
              print(m.group(1) if m else 'unknown')
          ")
          short_sha="${GITHUB_SHA::7}"
          found=0
          for src in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$src" ] || continue
            base=$(basename "$src")
            if [[ "$base" == *release.apk ]]; then
              if [[ "$base" == "app-release.apk" ]]; then
                dest="dist/EcoHub-${version}-${short_sha}.apk"
              else
                abi=$(echo "$base" | sed -E 's/^app-(.*)-release\.apk$/\1/')
                dest="dist/EcoHub-${version}-${short_sha}-${abi}.apk"
              fi
              cp "$src" "$dest"
              echo "Copied $src -> $dest"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No release APK produced under build/app/outputs/flutter-apk/" >&2
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecohub-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for i in {1..5}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.apk --clobber && break
            else
              notes_flag=()
              if [ -f "RELEASE.md" ] && [ -s "RELEASE.md" ]; then
                notes_flag=(--notes-file RELEASE.md)
              else
                tag_msg=$(git tag -l --format='%(contents)' "$tag" | sed '/^[[:space:]]*$/d')
                if [ -n "$tag_msg" ]; then
                  notes_flag=(--notes "$tag_msg")
                else
                  notes_flag=(--generate-notes)
                fi
              fi
              if gh release create "$tag" dist/*.apk --title "$tag" "${notes_flag[@]}"; then
                break
              fi
              sleep 3
            fi
          done

  build-ipa:
    name: Assemble IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Assemble iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Collect artifacts
        id: ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          version=$(python3 -c "
          import re
          with open('pubspec.yaml') as f:
              m = re.search(r'^version:\s*([^\+\s]+)', f.read(), re.M)
              print(m.group(1) if m else 'unknown')
          ")
          short_sha="${GITHUB_SHA::7}"
          dest="EcoHub-${version}-${short_sha}.ipa"
          (cd dist && zip -qr "$dest" Payload)
          rm -rf dist/Payload
          if [ ! -f "dist/$dest" ]; then
            echo "No IPA produced in dist/" >&2
            exit 1
          fi
          echo "Produced dist/$dest"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ecohub-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for i in {1..5}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.ipa --clobber && break
            else
              notes_flag=()
              if [ -f "RELEASE.md" ] && [ -s "RELEASE.md" ]; then
                notes_flag=(--notes-file RELEASE.md)
              else
                tag_msg=$(git tag -l --format='%(contents)' "$tag" | sed '/^[[:space:]]*$/d')
                if [ -n "$tag_msg" ]; then
                  notes_flag=(--notes "$tag_msg")
                else
                  notes_flag=(--generate-notes)
                fi
              fi
              if gh release create "$tag" dist/*.ipa --title "$tag" "${notes_flag[@]}"; then
                break
              fi
              sleep 3
            fi
          done
